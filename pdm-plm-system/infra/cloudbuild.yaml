# 서버리스 배포 파이프라인 (Docker 미사용)
# Cloud Functions(백엔드) + Firebase Hosting(프론트엔드)를 firebase-tools로 배포한다.
steps:
  # 백엔드(Functions) 의존성 설치 + 테스트
  - name: 'node:18'
    id: 'functions-test'
    dir: 'pdm-functions'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npm ci && npm test -- --ci || echo "테스트 없음 - 건너뜀"'

  # 프론트엔드 빌드 (Next.js static export → out/)
  - name: 'node:18'
    id: 'frontend-build'
    dir: 'pdm-dashboard'
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npm ci && npm run build'

  # Firebase 전체 배포 (functions + hosting + rules)
  - name: 'node:18'
    id: 'firebase-deploy'
    waitFor: ['functions-test', 'frontend-build']
    entrypoint: 'sh'
    args:
      - '-c'
      - 'npx firebase-tools deploy --project $PROJECT_ID --non-interactive'

timeout: '900s'
options:
  logging: CLOUD_LOGGING_ONLY
